[project]
name = "oblivionsec"
version = "1.0.2"
description = "OblivionSec - Next-Gen DAST Tool"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "mitmproxy",
    "browser-use",
    "openai-agents",
    "anthropic>=0.40.0"
]

[project.scripts]
oblivionsec = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["main.py"]
